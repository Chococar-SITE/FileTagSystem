[package]
name = "filetag-scanner"
version = "0.1.0"
edition = "2021"
description = "File scanner for the File Tag Management System — emits NDJSON to stdout"
authors = []

[[bin]]
name = "filetag-scanner"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
tempfile = "3"
