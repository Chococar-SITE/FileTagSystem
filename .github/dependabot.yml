version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"

  - package-ecosystem: cargo
    directory: /scanner
    schedule:
      interval: weekly
    commit-message:
      prefix: "scanner"

  - package-ecosystem: gomod
    directory: /server
    schedule:
      interval: weekly
    commit-message:
      prefix: "server"

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    commit-message:
      prefix: "web"
