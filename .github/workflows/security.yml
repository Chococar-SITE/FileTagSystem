name: Security

on:
  push:
    branches: [main, master, "claude/**"]
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # weekly, Monday 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Scan the full git history + working tree for committed secrets.
  # Uses the gitleaks binary directly (no org license required).
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install gitleaks
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ver=$(curl -sSfL -H "Authorization: Bearer $GH_TOKEN" \
            https://api.github.com/repos/gitleaks/gitleaks/releases/latest \
            | grep -oP '"tag_name":\s*"v\K[^"]+')
          echo "Installing gitleaks v$ver"
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${ver}/gitleaks_${ver}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          sudo install gitleaks /usr/local/bin/gitleaks
      - name: Scan
        run: gitleaks detect --source . --redact --no-banner --verbose --exit-code 1

  # Review dependencies introduced by a PR for known vulnerabilities.
  # Requires the repo's Dependency Graph to be enabled (Settings → Security &
  # analysis). It is currently non-blocking so a disabled graph can't red-flag
  # every PR; once Dependency Graph is enabled, drop `continue-on-error` to make
  # it enforcing again.
  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/dependency-review-action@v5
        continue-on-error: true
        with:
          fail-on-severity: high

  # NOTE: CodeQL static analysis is provided by GitHub's *default* code-scanning
  # setup (Settings → Code security → Code scanning), which is enabled on this
  # repo. An advanced CodeQL workflow is intentionally NOT defined here: running
  # both setups conflicts and makes the default-setup "CodeQL" check fail. To use
  # a custom CodeQL config instead, switch code scanning to "Advanced" in
  # settings and re-add a codeql job here.
